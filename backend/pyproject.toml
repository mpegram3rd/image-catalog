[project]
name = "image-catalog"
version = "0.1.0"
description = "A searchable catalog of your images"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "chromadb==1.5.9",
    "fastapi[standard]>=0.141.1",
    "openai>=3.3.1",
    "pydantic-settings>=2.15.0",
    "pillow>=12.3.0",
    "open-clip-torch>=3.3.0",
    "python-multipart>=0.0.32",
    "numpy>=2.5.2",
    "fastmcp>=3.4.7",
    "uvicorn>=0.52.4",
]
